<div
  #container
  style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #000;
    overflow: hidden;
    display: flex;
    z-index: 0;
  "
  (mousemove)="onMove($event)"
  (mouseenter)="enter()"
  (mouseleave)="leave()"
>

  <!-- Background: Entropy -->
  <app-entropy style="
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  "></app-entropy>

  <!-- SVG Spotlight beam -->
  <svg
    style="
      pointer-events: none;
      position: absolute;
      z-index: 1;
      height: 169%;
      width: 138%;
      top: -160px;
      left: 60px;
      opacity: 0;
      animation: spotlight 2s ease forwards 0.3s;
    "
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 3787 2842"
    fill="none"
  >
    <g filter="url(#sf)">
      <ellipse
        cx="1924.71" cy="273.501" rx="1924.71" ry="273.501"
        transform="matrix(-0.822377 -0.568943 -0.568943 0.822377 3631.88 2291.09)"
        fill="white" fill-opacity="0.21"
      />
    </g>
    <defs>
      <filter id="sf" x="0.86" y="0.84" width="3785" height="2840"
        filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
        <feFlood flood-opacity="0" result="bg"/>
        <feBlend mode="normal" in="SourceGraphic" in2="bg" result="shape"/>
        <feGaussianBlur stdDeviation="151"/>
      </filter>
    </defs>
  </svg>

  <!-- Mouse glow -->
  <div
    style="
      pointer-events: none;
      position: absolute;
      z-index: 3;
      width: 220px;
      height: 220px;
      border-radius: 9999px;
      filter: blur(40px);
      background: radial-gradient(circle at center, rgba(255,255,255,0.2), transparent 75%);
      transition: opacity 0.3s;
    "
    [style.left.px]="spotlightLeft"
    [style.top.px]="spotlightTop"
    [style.opacity]="isHover() ? 1 : 0"
  ></div>

  <!-- LEFT: Profile Card -->
  <div style="
    flex: 1;
    padding: 60px;
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: center;
    animation: fadeUp 0.8s ease forwards;
  ">

    <!-- Avatar -->
   <div style="
      width: 120px;
      height: 120px;
      border-radius: 9999px;
      background: linear-gradient(135deg, #3f3f3f, #1a1a1a);
      border: 2px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      margin-left: 20px;
      overflow: hidden;
    ">
 <img
  src="Professional Pic 2.png"
  alt="Profile"
  style="width: 100%; height: 100%; object-fit: cover; display: block;"
/>
    </div>

    <!-- Name -->
    <h1 style="
      font-size: 2.2rem;
      font-weight: 700;
      margin: 0 0 6px 0;
      background-image: linear-gradient(to bottom, #f5f5f5, #737373);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    ">
      Umar Qadri
    </h1>

    <!-- Role -->
    <p style="
      margin: 0 0 28px 0;
      font-size: 0.95rem;
      color: #737373;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
    ">
      Full-Stack Developer
    </p>

    <!-- Divider -->
    <div style="
      width: 40px;
      height: 1px;
      background: rgba(255,255,255,0.15);
      margin-bottom: 28px;
    "></div>

    <!-- Info rows -->
    <div style="display: flex; flex-direction: column; gap: 16px;">

      <!-- Email -->
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="
          width: 36px; height: 36px;

          background: rgba(255,255,255,0.06);
          border: 1px solid rgba(255,255,255,0.08);
          display: flex; align-items: center; justify-content: center;
          flex-shrink: 0;
        ">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">

            <path d="M2 8l10 6 10-6" stroke="#a3a3a3" stroke-width="1.5" stroke-linecap="round"/>

    flex: 1;
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;

  ">
  </div>
