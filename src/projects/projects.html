<section class="relative py-20 bg-black text-white overflow-hidden">

  <!-- Background layer -->
  <div class="absolute inset-0 z-0">
    <app-entropy></app-entropy>
  </div>

  <!-- Dark shadow overlay -->
  <div class="absolute inset-0 z-[1] 
              bg-gradient-to-b 
              from-black/70 via-black/50 to-black/80">
  </div>

  <!-- Content layer -->
  <div class="relative z-10 container mx-auto px-4 md:px-10">

    <!-- Heading -->
    <h1 class="mb-10 text-3xl md:text-4xl font-semibold">
      {{ heading }}
    </h1>

    <!-- List -->
    <div class="flex flex-col border-t border-white/20">

      <div *ngFor="let item of items" class="border-b border-white/20">

        <div class="grid md:grid-cols-4 items-center gap-4 py-6">

          <!-- Icon + Title + Category -->
          <div class="flex items-center gap-3 md:col-span-1">
            <div class="h-12 w-12 flex items-center justify-center
                        rounded-md bg-white/10 text-white text-xl">
              <span class="text-xl">{{ item.icon }}</span>
            </div>
            <div>
              <h3 class="font-semibold">{{ item.title }}</h3>
              <p class="text-sm text-gray-400">{{ item.category }}</p>
            </div>
          </div>

          <!-- Description -->
          <div class="md:col-span-2 text-lg font-semibold">
            {{ item.description }}
          </div>

          <!-- Button -->
          <div class="flex justify-end">
            <a
              [href]="item.link"
              target="_blank"
              class="px-4 py-2 border border-white/40 rounded-md
                     hover:bg-white hover:text-black transition
                     flex items-center gap-2 text-sm font-medium"
            >
              View project
              <i class="ti ti-arrow-right"></i>
            </a>
          </div>

        </div>

      </div>

    </div>

  </div>
</section>
